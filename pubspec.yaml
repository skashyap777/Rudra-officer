name: rudra_officer
description: "RUDRA Officer - PWD Pothole Management System (Flutter Migration)"
publish_to: 'none'

version: 1.9.0+9

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^12.1.1

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Camera & Images
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  image_cropper: ^8.0.2
  cached_network_image: ^3.3.1

  # ML
  tflite_flutter: ^0.12.1

  # Utilities
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  device_info_plus: ^10.1.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  intl: ^0.19.0
  image: ^4.2.0
  logger: ^2.0.2
  timezone: ^0.9.4
  equatable: ^2.0.5
  http_parser: ^4.0.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Local Notifications
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  freezed: ^2.4.2
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/fonts/
